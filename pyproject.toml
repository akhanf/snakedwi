[project]
name = "snakedwi"
version = "0.2.0"
description = "snakedwi - BIDS app and snakemake workflow for dwi pre-processing"
authors = [{name="Ali Khan", email="alik@robarts.ca"}]
license = "MIT"
requires-python = ">= 3.9, <3.11"
dependencies = []
scripts = { snakedwi = "snakedwi.run:app.run" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.feature.runtime.dependencies]
snakebids = ">=0.14.0,<0.15"
appdirs   = ">=1.4.4,<2.0.0"
conda = ">=25.5.0,<26"

[tool.pixi.feature.dev.dependencies]
flake8 = ">=4.0.1,<5.0.0"
pytest-console-scripts = ">=1.2.1,<2.0.0"
pytest = "*"
black = ">=24.0.0,<25.0.0"
pylint = ">=2.11.1,<3.0.0"
isort = ">=5.10.1,<6.0.0"
poethepoet = ">=0.10.0,<0.11.0"
snakefmt = ">=0.10.0,<0.11.0"
pygraphviz = "*"
Jinja2 = ">=3.0.3,<4.0.0"

[tool.pixi.environments.default]
features = ["runtime"]

[tool.pixi.environments.dev]
features = ["runtime", "dev"]

[tool.pixi.environments.dev-only]
features = ["dev"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pixi.pypi-dependencies]
snakedwi = { path = ".", editable = true }

[tool.pixi.tasks]
quality_check = "isort snakedwi/*.py snakedwi/plugins/*.py -c && black snakedwi --check && snakefmt snakedwi --check"
quality_fix = "isort snakedwi/*.py snakedwi/plugins/*.py && black snakedwi  && snakefmt snakedwi"



